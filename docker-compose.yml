services:
  db:
    image: postgres:16-alpine
    container_name: smart-campus-db
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
      POSTGRES_DB: smartcampus
    ports:
      - "5432:5432"
    volumes:
      - smart-campus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart-campus-db-data:
